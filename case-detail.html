<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例详情 - 高锦涛</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        /* 侧边目录高亮样式 */
        .toc-link {
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .toc-link:hover {
            color: #4f46e5;
            background-color: #eef2ff;
        }
        .toc-link.active {
            color: #4f46e5;
            border-left-color: #4f46e5;
            background-color: #eef2ff;
            font-weight: 600;
        }
        /* 移动端水平滚动目录 */
        .toc-scroll::-webkit-scrollbar {
            height: 3px;
        }
        .toc-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .toc-scroll::-webkit-scrollbar-thumb {
            background: #c7d2fe;
            border-radius: 4px;
        }
        /* 平滑滚动 */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-xl font-bold text-indigo-600">高锦涛</a>
                </div>
                <div class="hidden md:flex items-center space-x-6">
                    <a href="index.html#home" class="text-gray-700 hover:text-indigo-600">首页</a>
                    <a href="index.html#about" class="text-gray-700 hover:text-indigo-600">关于我</a>
                    <a href="index.html#cases" class="text-gray-700 hover:text-indigo-600">案例</a>
                    <a href="index.html#skills" class="text-gray-700 hover:text-indigo-600">技能</a>
                    <a href="index.html#contact" class="text-gray-700 hover:text-indigo-600">联系我</a>
                </div>
                <!-- 移动端菜单按钮 -->
                <div class="md:hidden flex items-center">
                    <a href="index.html#cases" class="text-gray-700 hover:text-indigo-600">
                        <i class="fa fa-arrow-left text-lg"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main id="main-content" class="max-w-7xl mx-auto px-4 py-8">
        <!-- 由JS动态渲染 -->
    </main>

    <!-- 案例未找到提示 -->
    <div id="not-found" class="hidden max-w-4xl mx-auto px-4 py-20 text-center">
        <div class="bg-white rounded-2xl shadow-md p-12">
            <i class="fa fa-exclamation-circle text-6xl text-gray-300 mb-6"></i>
            <h2 class="text-2xl font-bold text-gray-700 mb-4">案例未找到</h2>
            <p class="text-gray-500 mb-8">请检查URL中的案例ID是否正确</p>
            <a href="index.html#cases" class="inline-flex items-center gap-2 bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 transition-colors">
                <i class="fa fa-arrow-left"></i> 返回案例列表
            </a>
        </div>
    </div>

    <script src="cases-data.js"></script>
    <script>
        // 获取URL参数中的案例ID
        // 内容渲染：支持图片、表格、换行
        function renderContent(text) {
            // 处理图片 ![描述](链接)
            let html = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" class="my-4 rounded-lg shadow-sm max-w-full border border-gray-200">');
            // 处理表格
            html = html.replace(/((?:\|.+\|\n?)+)/g, function(table) {
                const rows = table.trim().split('\n').filter(r => r.trim());
                if (rows.length === 0) return table;
                // 跳过分隔行（|---|---|）
                const dataRows = rows.filter(r => !/^\|[\s\-:|]+\|$/.test(r.trim()));
                if (dataRows.length === 0) return table;
                let tableHtml = '<div class="my-4 overflow-x-auto"><table class="w-full text-sm border-collapse"><tbody>';
                dataRows.forEach((row, idx) => {
                    const cells = row.split('|').filter(c => c.trim() !== '');
                    const tag = idx === 0 ? 'th' : 'td';
                    const bgClass = idx === 0 ? 'bg-gray-100 font-semibold text-gray-800' : 'text-gray-700';
                    tableHtml += '<tr>';
                    cells.forEach(cell => {
                        tableHtml += `<${tag} class="border border-gray-200 px-3 py-2 ${bgClass}">${cell.trim()}</${tag}>`;
                    });
                    tableHtml += '</tr>';
                });
                tableHtml += '</tbody></table></div>';
                return tableHtml;
            });
            // 处理换行
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        const params = new URLSearchParams(window.location.search);
        const caseId = params.get('id');

        // 查找对应案例
        const caseItem = cases.find(c => c.id === caseId);

        if (caseItem) {
            // 动态设置页面标题
            document.title = caseItem.title + ' - 高锦涛';

            // 渲染页面内容
            renderCaseDetail(caseItem);
        } else {
            // 显示案例未找到
            document.getElementById('main-content').classList.add('hidden');
            document.getElementById('not-found').classList.remove('hidden');
        }

        function renderCaseDetail(c) {
            const mainContent = document.getElementById('main-content');

            // 生成section卡片HTML
            const sectionsHtml = c.sections.map((s, i) => `
                <div id="section-${i}" class="bg-white rounded-xl shadow-sm p-6 md:p-8">
                    <h3 class="text-lg md:text-xl font-bold text-gray-800 mb-4 flex items-center gap-3">
                        <span class="flex-shrink-0 w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-sm font-bold">${i + 1}</span>
                        ${s.title}
                    </h3>
                    <div class="text-gray-700 leading-relaxed pl-11">${renderContent(s.content)}</div>
                </div>
            `).join('');

            // 生成侧边目录HTML
            const tocHtml = c.sections.map((s, i) => `
                <a href="#section-${i}" class="toc-link block px-4 py-2 text-sm text-gray-600 rounded-r-lg" data-section="section-${i}">
                    ${s.title}
                </a>
            `).join('');

            mainContent.innerHTML = `
                <!-- 面包屑导航 -->
                <nav class="mb-6 text-sm text-gray-500">
                    <ol class="flex items-center gap-2 flex-wrap">
                        <li><a href="index.html" class="hover:text-indigo-600 transition-colors">首页</a></li>
                        <li><i class="fa fa-chevron-right text-xs text-gray-400"></i></li>
                        <li><a href="index.html#cases" class="hover:text-indigo-600 transition-colors">案例</a></li>
                        <li><i class="fa fa-chevron-right text-xs text-gray-400"></i></li>
                        <li class="text-gray-800 font-medium">${c.title}</li>
                    </ol>
                </nav>

                <!-- 移动端水平滚动目录 -->
                <div class="md:hidden mb-6">
                    <div class="toc-scroll flex gap-2 overflow-x-auto pb-2">
                        ${c.sections.map((s, i) => `
                            <a href="#section-${i}" class="flex-shrink-0 px-4 py-2 bg-white rounded-full text-sm text-gray-600 shadow-sm hover:bg-indigo-50 hover:text-indigo-600 transition-colors whitespace-nowrap" data-section="section-${i}">
                                ${s.title}
                            </a>
                        `).join('')}
                    </div>
                </div>

                <!-- 两栏布局 -->
                <div class="flex gap-8">
                    <!-- 左侧：侧边目录（桌面端） -->
                    <aside class="hidden md:block w-56 flex-shrink-0">
                        <div class="sticky top-24">
                            <h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 px-4">目录</h4>
                            <nav id="toc-nav" class="space-y-1">
                                ${tocHtml}
                            </nav>
                        </div>
                    </aside>

                    <!-- 右侧：案例内容 -->
                    <div class="flex-1 min-w-0 max-w-4xl">
                        <!-- 封面图 + 标题 + tags + overview -->
                        <div class="bg-white rounded-xl shadow-sm overflow-hidden mb-8">
                            <div class="relative">
                                <img src="${c.image}" alt="${c.title}" class="w-full h-48 md:h-64 object-cover">
                                <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>
                                <div class="absolute bottom-4 left-6 right-6">
                                    <div class="flex gap-2 mb-3 flex-wrap">
                                        ${c.tags.map(t => `<span class="px-3 py-1 bg-white/20 text-white text-xs rounded-full backdrop-blur-sm">${t}</span>`).join('')}
                                    </div>
                                    <h1 class="text-2xl md:text-3xl font-bold text-white">${c.title}</h1>
                                </div>
                            </div>
                            <div class="p-6 md:p-8">
                                <p class="text-gray-600 text-lg leading-relaxed">${c.overview}</p>
                            </div>
                        </div>

                        <!-- 所有section卡片 -->
                        <div class="space-y-6">
                            ${sectionsHtml}
                        </div>

                        <!-- 技术栈 + 项目成果 -->
                        <div class="mt-8 bg-white rounded-xl shadow-sm p-6 md:p-8">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                                        <i class="fa fa-cog"></i> 技术栈
                                    </h4>
                                    <p class="text-gray-800">${c.tech}</p>
                                </div>
                                <div>
                                    <h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                                        <i class="fa fa-trophy"></i> 项目成果
                                    </h4>
                                    <p class="text-gray-800 font-medium">${c.result}</p>
                                </div>
                            </div>
                        </div>

                        <!-- 返回案例列表按钮 -->
                        <div class="mt-10 text-center">
                            <a href="index.html#cases" class="inline-flex items-center gap-2 bg-indigo-600 text-white px-8 py-3 rounded-lg hover:bg-indigo-700 transition-colors font-medium">
                                <i class="fa fa-arrow-left"></i> 返回案例列表
                            </a>
                        </div>
                    </div>
                </div>
            `;

            // 初始化IntersectionObserver
            initScrollSpy();
        }

        function initScrollSpy() {
            const sectionIds = caseItem.sections.map((_, i) => `section-${i}`);
            const tocLinks = document.querySelectorAll('.toc-link');

            if (sectionIds.length === 0 || tocLinks.length === 0) return;

            const observerOptions = {
                root: null,
                rootMargin: '-80px 0px -60% 0px',
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;

                        // 更新桌面端侧边目录高亮
                        tocLinks.forEach(link => {
                            if (link.getAttribute('data-section') === id) {
                                link.classList.add('active');
                            } else {
                                link.classList.remove('active');
                            }
                        });

                        // 更新移动端目录高亮
                        const mobileLinks = document.querySelectorAll('.toc-scroll a[data-section]');
                        mobileLinks.forEach(link => {
                            if (link.getAttribute('data-section') === id) {
                                link.classList.add('bg-indigo-50', 'text-indigo-600');
                                link.classList.remove('bg-white', 'text-gray-600');
                                // 滚动到可见区域
                                link.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                            } else {
                                link.classList.remove('bg-indigo-50', 'text-indigo-600');
                                link.classList.add('bg-white', 'text-gray-600');
                            }
                        });
                    }
                });
            }, observerOptions);

            sectionIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    observer.observe(el);
                }
            });
        }
    </script>
</body>
</html>
